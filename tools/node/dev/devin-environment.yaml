# Idol Devin projection.
#
# This is physical agent setup only. It is not language authority. Devin must
# start from AGENTS.md and repository facts, the same as Codex and Cursor.

initialize:
  - run: |
      set -eu
      cd "$(git rev-parse --show-toplevel)"
      if command -v mise >/dev/null 2>&1; then
        mise install
      fi
      zig build --summary all
      ./tools/node/dev/orient

maintenance:
  - run: |
      set -eu
      cd "$(git rev-parse --show-toplevel)"
      ./tools/node/dev/orient
      IDOL_DOCTOR_SKIP_GATES=1 ./tools/node/dev/doctor

knowledge:
  - name: authority
    contents: |
      Read AGENTS.md first. It routes to docs/spec/constitution.md, CLAUDE.md,
      docs/spec/source.md, docs/spec/AUTHORITY.md, docs/bootstrap.md, and the
      relevant projection. docs/spec/constitution.md is the sole semantic law.
      Current language and project identity is Idol (`idol`, `.id`). Use skill
      idol-dev (`.pi/skills/idol-dev`), not duon-development. Historical Idol,
      Duo, Duon, and `.id` are provenance only. This Devin projection is not
      semantic authority.

  - name: orientation
    contents: |
      Run ./tools/node/dev/orient before choosing work. Treat its output as a
      live derived state projection, not as architecture law. Follow the
      authority links it prints.

  - name: coordination
    contents: |
      This is a concurrent checkout. Inspect git status, HEAD, recent commits,
      gaps, and live claims before editing. Claim exact paths through
      duo_dev_claim_acquire when MCP is available. Never use git stash,
      git reset --hard, git add ., or git add -A. Commit explicit pathspecs.

  - name: verification
    contents: |
      Use ./tools/node/dev/doctor for fast development-node admission. Use
      ./tools/node/dev/probe-mcp for raw MCP initialize health. Heavy gates must
      resolve the repository root and run through its `zig-out/bin/duo` with
      `run --backend=c`, its `scripts/duo_lock.id`, and `-- ...`.
      Evidence is exact tree, command, executed path, outcome, and positive
      controls.

  - name: platform-boundary
    contents: |
      Devin cloud sessions may not be the owner's Apple Silicon Mac. Do not
      claim macOS/Apple ARM64 realization, local Codex/Cursor MCP integration,
      or native performance from a Linux/cloud-only run. Emit
      MAC-VERIFICATION-REQUIRED with exact commands when local Mac proof is
      required.
