name: Docs

on:
  push:
    branches:
      - main
  pull_request:

# Concurrency fence: a newly queued docs run cancels previously PENDING
# runs for the same workflow+ref; a RUNNING build/deploy is allowed to
# finish (cancel-in-progress defaults to false).
concurrency:
  group: docs-${{ github.ref }}

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, mac-mini, idol]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build docs site
        # docs/ is no longer an mdBook project (the prose book was removed
        # per req23), so assemble a static site from the structural docs
        # instead of running `mdbook build docs` against a missing
        # docs/src/SUMMARY.md. All paths are quoted: this runner's work
        # path contains a space (/Volumes/d 1/...).
        run: |
          set -eu
          rm -rf site
          mkdir -p site/docs
          cp -R docs/. site/docs/
          {
            printf '<!doctype html>\n<html><head><meta charset="utf-8">\n'
            printf '<title>Idol docs</title></head><body>\n<h1>Idol docs</h1>\n<ul>\n'
            ( cd site/docs && find . -name '*.md' | sort ) | while IFS= read -r f; do
              f="${f#./}"
              printf '<li><a href="docs/%s">%s</a></li>\n' "$f" "$f"
            done
            printf '</ul>\n</body></html>\n'
          } > site/index.html
          test -s site/index.html
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
