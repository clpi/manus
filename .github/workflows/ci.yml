name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build unit-test

      - name: Compile-fail tests
        run: bash scripts/run_compile_fail_tests.sh

      - name: WASM compilation smoke test
        run: |
          ./zig-out/bin/duo compile examples/hello.lua --target wasm32-wasi -o /tmp/hello.wasm
          file /tmp/hello.wasm | grep -q "WebAssembly"
          echo "WASM OK"

      - name: Install WASI runtime and WABT
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: WASM codegen compatibility tests
        run: bash scripts/test_wasm_codegen.sh

      - name: WASI execution tests
        run: bash scripts/test_wasm_execution.sh

  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build
        run: zig build

      - name: Benchmark
        run: zig build bench

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: native
            artifact: duo
          - os: macos-latest
            target: native
            artifact: duo
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Rename binary for release
        run: mv zig-out/bin/duo zig-out/bin/duo-${{ matrix.os }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: duo-${{ matrix.os }}
          path: zig-out/bin/duo-${{ matrix.os }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/duo-${{ matrix.os }}
