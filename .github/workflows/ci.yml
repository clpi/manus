name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Bootstrap pin. build.zig.zon remains the package-level compatibility floor.
  ZIG_VERSION: 0.17.0-dev.389+f5a1968f6

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build migration compiler for gates
        run: zig build

      - name: Repository admission
        run: zig build repo-hygiene public-safety

  build:
    runs-on: ubuntu-latest
    needs: [hygiene]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Record toolchain
        run: |
          echo "ZIG_VERSION=$(zig version)" >> "$GITHUB_ENV"
          zig version | tee toolchain.txt

      - name: Build
        run: zig build

      - name: Unit and compile-fail tests
        run: zig build test

      - name: G-061 metaprogramming smokes
        run: zig build meta-smoke

      - name: G-061 strict transform gate
        run: zig build meta-gate

      - name: WASM compilation smoke test
        run: |
          ./zig-out/bin/idol compile examples/hello.lua --target wasm32-wasi -o /tmp/hello.wasm
          file /tmp/hello.wasm | grep -q "WebAssembly"
          echo "WASM OK"

      - name: Install WASI runtime and WABT
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          curl https://wasmtime.dev/install.sh -sSf | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: WASM conformance against Wasmtime
        run: zig build wasm-test

      - name: Upload toolchain record
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-ubuntu
          path: toolchain.txt

  reproducibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Reproducibility smoke
        run: zig build reproducibility-smoke

  matrix-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Benchmark (explicit c-specialized profile)
        run: BENCH_BACKEND=c-specialized zig build bench

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: native
            artifact: idol
          - os: macos-latest
            target: native
            artifact: idol
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Rename binary for release
        run: mv zig-out/bin/idol zig-out/bin/idol-${{ matrix.os }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: idol-${{ matrix.os }}
          path: zig-out/bin/idol-${{ matrix.os }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/idol-${{ matrix.os }}
