name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Bootstrap pin. build.zig.zon remains the package-level compatibility floor.
  # The pin tracks the toolchain the tree is actually developed and verified
  # under — the same snapshot candidate.yml uses to build the protected base.
  # The retired 0.17.0-dev.389 pin was never exercised by a runner, so it never
  # carried build evidence for any tree that shipped under it.
  ZIG_VERSION: 0.17.0-dev.1567+f0354179a

jobs:
  hygiene:
    runs-on: [self-hosted, macOS, ARM64, mac-mini, idol]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zig cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Authority and semantic-graph regression gates
        run: |
          sh gate/authority.sh
          sh gate/semantic-graph-authority.sh

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # setup-zig's built-in cache save shells out to tar with the
          # workspace path unquoted, which breaks on this runner's
          # space-containing work path (/Volumes/d 1/...). Cache via
          # actions/cache instead, which passes paths as argv.
          use-cache: false

      - name: Build migration compiler for gates
        run: zig build

      - name: Repository admission
        # public-safety runs as gate/public-safety.id so a host with no
        # direct-native realization reports the exact DNB004 host fact (NOT
        # MEASURED) instead of a bare `run ./zig-out/bin/idol failure` that
        # reads as a scan finding. The step still fails on such a host: NOT
        # MEASURED is honest attribution, not admission.
        run: |
          zig build repo-hygiene
          ./zig-out/bin/idol run --backend=direct gate/public-safety.id

  build:
    runs-on: [self-hosted, macOS, ARM64, mac-mini, idol]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    needs: [hygiene]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zig cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # setup-zig's built-in cache save shells out to tar with the
          # workspace path unquoted, which breaks on this runner's
          # space-containing work path (/Volumes/d 1/...). Cache via
          # actions/cache instead, which passes paths as argv.
          use-cache: false

      - name: Record toolchain
        run: |
          echo "ZIG_VERSION=$(zig version)" >> "$GITHUB_ENV"
          zig version | tee toolchain.txt

      - name: Build
        run: zig build

      - name: Native timing regression controls
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import shutil
          import statistics
          import subprocess
          import tempfile
          
          root = Path.cwd()
          compiler = root / "zig-out/bin/idol"
          source = root / "bench/timing.id"
          
          def require(condition, detail):
              if not condition:
                  raise RuntimeError(detail)
          
          def run(args, success=True):
              result = subprocess.run(args, capture_output=True, timeout=120)
              if success:
                  require(result.returncode == 0, repr(args) + "\n" + result.stdout.decode(errors="replace") + "\n" + result.stderr.decode(errors="replace"))
              return result
          
          with tempfile.TemporaryDirectory(prefix="timing-check-", dir=os.environ["RUNNER_TEMP"]) as directory:
              work = Path(directory)
              text = source.read_text()
              helpers = text[:text.index("runone:")]
              cases = [("10;20;30;", 3, 20), ("30;10;20;", 3, 20),
                       ("10;20;30;40;", 4, 25), ("0;0;", 2, 0),
                       ("9223372036854775806;9223372036854775807;", 2, 9223372036854775806)]
              probe = work / "median.id"
              probe.write_text(helpers + "\n" + "\n".join(f'print(medianstr("{samples}", {count}))' for samples, count, _ in cases) + "\n")
              median = work / "median"
              run([str(compiler), "compile", str(probe), "--backend", "native", "--no-cache", "-o", str(median)])
              expected = "".join(str(value) + "\n" for _, _, value in cases).encode()
              require(run([str(median)]).stdout == expected, "compiled median disagrees with independent expected values")
              timer = work / "timing"
              run([str(compiler), "compile", str(source), "--backend", "native", "--no-cache", "-o", str(timer)])
              good = shutil.which("true")
              bad = shutil.which("false")
              require(good and bad, "positive and negative process controls unavailable")
              args = [str(timer), good, good, "21", "3", "0", "", str(compiler), "native-no-cache", os.environ["GITHUB_SHA"], "200"]
              result = run(args)
              fields = {}
              for line in result.stdout.decode().splitlines():
                  key, sep, value = line.partition(": ")
                  require(sep and key not in fields, "malformed or duplicate output: " + line)
                  fields[key] = value
              require(fields.get("status") == "ok", "timer did not complete successfully")
              for face in ("candidate", "comparator"):
                  raw = fields[face + "_samples_ns"]
                  require(raw.endswith(";"), "missing sample terminator")
                  samples = [int(value) for value in raw[:-1].split(";")]
                  require(len(samples) == 21 and all(value >= 0 for value in samples), "invalid sample count or value")
                  require(int(fields[face + "_median_ns"]) == sorted(samples)[10], "native median does not match its own raw samples")
                  reference = statistics.variance([value / 1000.0 for value in samples])
                  actual = float(fields[face + "_variance_us2"])
                  require(math.isfinite(actual) and actual >= 0 and math.isclose(actual, reference, rel_tol=1e-7, abs_tol=1e-6), "native variance does not match independent reference")
              require(fields.get("verdict") == "inconclusive" and fields.get("significant") == "unverified", "unqualified inference was promoted")
              wrong = list(args)
              wrong[1] = bad
              rejected = run(wrong, success=False)
              require(rejected.returncode == 1 and b"status: mismatch" in rejected.stdout, "wrong process result was not rejected at the requested boundary")
              print(result.stdout.decode())
              print(json.dumps({"outcome": "pass", "scope": "compiled median helpers and full native timer; not performance qualification", "median_controls": len(cases), "timed_invocations": 42, "wrong_exit": "rejected", "compiler_sha256": hashlib.sha256(compiler.read_bytes()).hexdigest(), "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(), "revision": os.environ["GITHUB_SHA"]}))
          PY

      - name: Materialize pinned idol-native root
        # The MCP gate pairs against an exact, clean idol-native worktree at
        # the manifest-pinned revision (tools/node/dev/mcp.manifest.json),
        # rooted at ${{ github.workspace }}/idol-native (IDOL_NATIVE_ROOT).
        # clpi/idol-native is private: until a deploy key is provisioned as
        # the IDOL_NATIVE_DEPLOY_KEY secret this step is a no-op and pairing
        # fails closed with "root is missing". All paths are quoted: the
        # runner work path contains a space (/Volumes/d 1/...).
        env:
          IDOL_NATIVE_DEPLOY_KEY: ${{ secrets.IDOL_NATIVE_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${IDOL_NATIVE_DEPLOY_KEY:-}" ]; then
            echo "idol-native deploy key not provisioned; skipping materialization (pairing will fail closed)"
            exit 0
          fi
          rev="$(jq -r '.servers[] | select(.name == "idol-native") | .revision' tools/node/dev/mcp.manifest.json)"
          case "$rev" in
            ''|*[!0-9a-f]*) echo "bad pinned revision: $rev" >&2; exit 1 ;;
          esac
          keyfile="$(mktemp "${RUNNER_TEMP:-/tmp}/idol-native-key.XXXXXX")"
          chmod 600 "$keyfile"
          printf '%s' "$IDOL_NATIVE_DEPLOY_KEY" > "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          export GIT_SSH_COMMAND="ssh -i $keyfile -o StrictHostKeyChecking=accept-new"
          rm -rf idol-native
          git init -q idol-native
          git -C idol-native remote add origin git@github.com:clpi/idol-native.git
          git -C idol-native fetch --depth 1 origin "$rev"
          git -C idol-native checkout -q "$rev"
          IDOL_NATIVE_ROOT="$GITHUB_WORKSPACE/idol-native" ./tools/node/dev/mcp-pair validate ./tools/node/dev/mcp.manifest.json idol-native

      - name: Unit and compile-fail tests
        run: zig build test
        env:
          # Absolute path to the pinned idol-native worktree the MCP gate
          # pairs against (see tools/node/dev/mcp.manifest.json), resolved
          # from GITHUB_WORKSPACE at runtime. mcp-pair fails closed on
          # relative paths. NOTE: the idol-native checkout must be
          # materialized at this path at the manifest-pinned revision;
          # clpi/idol-native is private and no credential is provisioned
          # yet, so the gate will report "root is missing" until it is.
          IDOL_NATIVE_ROOT: ${{ github.workspace }}/idol-native

      - name: G-061 metaprogramming smokes
        run: zig build meta-smoke

      - name: G-061 strict transform gate
        run: zig build meta-gate

      - name: WASM compilation smoke test
        run: |
          ./zig-out/bin/idol compile examples/hello.lua --target wasm32-wasi -o /tmp/hello.wasm
          file /tmp/hello.wasm | grep -q "WebAssembly"
          echo "WASM OK"

      - name: Install pinned Wasmtime oracle
        run: |
          test "$(uname -sm)" = "Darwin arm64"
          archive="$RUNNER_TEMP/wasmtime-v47.0.3-aarch64-macos.tar.xz"
          curl --fail --location --silent --show-error \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-aarch64-macos.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            c2684249e5d9ef9351942cf2d315982cf201fe0300f05d63bc1527446f0cd37f \
            "$archive" | shasum -a 256 --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v47.0.3-aarch64-macos" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wasmtime-v47.0.3-aarch64-macos/wasmtime" --version

      - name: Preserve compiler Zig for focused evidence
        run: echo "IDOL_ZIG=$(command -v zig)" >> "$GITHUB_ENV"

      - name: Install pinned Wart build Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1567+f0354179a
          # setup-zig's built-in cache save shells out to tar with the
          # workspace path unquoted, which breaks on this runner's
          # space-containing work path (/Volumes/d 1/...). Cache via
          # actions/cache instead, which passes paths as argv.
          use-cache: false

      - name: Build frozen Wart oracle
        run: |
          wart_repo="$RUNNER_TEMP/wart-oracle"
          git clone --filter=blob:none --no-checkout https://github.com/clpi/wart.git "$wart_repo"
          git -C "$wart_repo" checkout --detach ca2b0b9c0fb8c397987be2b4475fd1ccfe4d150b
          test "$(git -C "$wart_repo" rev-parse HEAD)" = ca2b0b9c0fb8c397987be2b4475fd1ccfe4d150b
          test -z "$(git -C "$wart_repo" status --porcelain=v1 --untracked-files=all)"
          (cd "$wart_repo" && zig build -Drelease=true)
          wart_bin="$wart_repo/zig-out/bin/wart"
          wart_hash=$(shasum -a 256 "$wart_bin" | cut -d ' ' -f 1)
          wart_provenance="$wart_bin.provenance"
          "$wart_bin" --version
          printf 'revision=%s\nzig_version=%s\nbuild=%s\nhost=%s\nbinary_sha256=%s\n' \
            ca2b0b9c0fb8c397987be2b4475fd1ccfe4d150b \
            "$(zig version)" \
            'zig build -Drelease=true' \
            "$(uname -sm)" \
            "$wart_hash" > "$wart_provenance"
          echo "WART_ORACLE_REPO=$wart_repo" >> "$GITHUB_ENV"
          echo "WART_ORACLE_BIN=$wart_bin" >> "$GITHUB_ENV"
          echo "WART_ORACLE_PROVENANCE=$wart_provenance" >> "$GITHUB_ENV"

      - name: WASM focused evidence against frozen oracles
        run: $IDOL_ZIG build wasm-test

      - name: Upload toolchain record
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-ubuntu
          path: toolchain.txt

  reproducibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Reproducibility smoke
        run: zig build reproducibility-smoke

  matrix-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Benchmark (explicit c-specialized profile)
        run: BENCH_BACKEND=c-specialized zig build bench

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: native
            artifact: idol
          - os: macos-latest
            target: native
            artifact: idol
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Rename binary for release
        run: mv zig-out/bin/idol zig-out/bin/idol-${{ matrix.os }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: idol-${{ matrix.os }}
          path: zig-out/bin/idol-${{ matrix.os }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/idol-${{ matrix.os }}
