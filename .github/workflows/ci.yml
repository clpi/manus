name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Bootstrap pin. build.zig.zon remains the package-level compatibility floor.
  # The pin tracks the toolchain the tree is actually developed and verified
  # under — the same snapshot candidate.yml uses to build the protected base.
  # The retired 0.17.0-dev.389 pin was never exercised by a runner, so it never
  # carried build evidence for any tree that shipped under it.
  ZIG_VERSION: 0.17.0-dev.1567+f0354179a

jobs:
  hygiene:
    runs-on: [self-hosted, macOS, ARM64, mac-mini, idol]
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zig cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Authority and semantic-graph regression gates
        run: |
          sh gate/authority.sh
          sh gate/semantic-graph-authority.sh

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Build migration compiler for gates
        run: zig build

      - name: Repository admission
        run: |
          zig build repo-hygiene
          ./zig-out/bin/idol run --backend=direct gate/public-safety.id

  build:
    runs-on: [self-hosted, macOS, ARM64, mac-mini, idol]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    needs: [hygiene]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zig cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Record toolchain
        run: |
          echo "ZIG_VERSION=$(zig version)" >> "$GITHUB_ENV"
          zig version | tee toolchain.txt
          git rev-parse HEAD | tee -a toolchain.txt
          shasum -a 256 build.zig bench/timing.id .github/workflows/ci.yml | tee -a toolchain.txt

      - name: Upload toolchain record
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-ubuntu
          path: |
            toolchain.txt
            build.zig

      - name: Build
        run: zig build

      - name: Native timing regression controls
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import shutil
          import signal
          import statistics
          import subprocess
          import tempfile
          
          
          def require(condition, detail):
              if not condition:
                  raise RuntimeError(detail)
          
          
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          
          
          def run(args, success=True):
              with tempfile.TemporaryFile() as out, tempfile.TemporaryFile() as err:
                  process = subprocess.Popen(args, stdout=out, stderr=err, start_new_session=True)
                  try:
                      process.wait(timeout=120)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                      raise RuntimeError('process group timed out: ' + repr(args))
                  out.seek(0)
                  err.seek(0)
                  stdout = out.read(1048577)
                  stderr = err.read(1048577)
                  require(len(stdout) <= 1048576 and len(stderr) <= 1048576, 'evidence exceeds observer limit: ' + repr(args))
                  result = subprocess.CompletedProcess(args, process.returncode, stdout, stderr)
                  if success:
                      require(result.returncode == 0, repr(args) + '\n' + stdout.decode(errors='replace') + '\n' + stderr.decode(errors='replace'))
                  return result
          
          
          def check(body, expected, rounds):
              fields = {}
              for line in body.decode().splitlines():
                  key, sep, value = line.partition(': ')
                  require(sep and key not in fields, 'malformed or duplicate output: ' + line)
                  fields[key] = value
              for key, value in expected.items():
                  require(fields.get(key) == str(value), 'incorrect field: ' + key)
              require(re.fullmatch('[0-9a-f]{64}', fields.get('compiler_sha256', '')), 'invalid compiler digest')
              for face in ('candidate', 'comparator'):
                  raw = fields[face + '_samples_ns']
                  require(re.fullmatch(r'(?:[0-9]+;)+', raw), 'malformed samples')
                  samples = [int(value) for value in raw[:-1].split(';')]
                  require(len(samples) == rounds and all(value <= 9223372036854775807 for value in samples), 'invalid sample count or value')
                  ordered = sorted(samples)
                  center = ordered[rounds // 2] if rounds % 2 else ordered[rounds // 2 - 1] + (ordered[rounds // 2] - ordered[rounds // 2 - 1]) // 2
                  require(int(fields[face + '_median_ns']) == center, 'native median does not match its samples')
                  reference = statistics.variance([value / 1000.0 for value in samples])
                  actual = float(fields[face + '_variance_us2'])
                  require(math.isfinite(actual) and actual >= 0 and math.isclose(actual, reference, rel_tol=1e-7, abs_tol=1e-6), 'native variance does not match independent reference')
              return fields
          
          
          def exercise():
              root = Path.cwd()
              compiler = root / 'zig-out/bin/idol'
              source = root / 'bench/timing.id'
              revision = os.environ['GITHUB_SHA']
              before = digest(compiler)
              with tempfile.TemporaryDirectory(prefix='timing-check-', dir=os.environ['RUNNER_TEMP']) as directory:
                  work = Path(directory)
                  text = source.read_text()
                  helpers = text[:text.index('runone:')]
                  cases = [('10;20;30;', 3, 20), ('30;10;20;', 3, 20), ('10;20;30;40;', 4, 25), ('0;0;', 2, 0), ('9223372036854775806;9223372036854775807;', 2, 9223372036854775806)]
                  probe = work / 'median.id'
                  probe.write_text(helpers + '\n' + '\n'.join(f'print(medianstr("{samples}", {count}))' for samples, count, _ in cases) + '\n')
                  median = work / 'median'
                  run([str(compiler), 'compile', str(probe), '--backend', 'native', '--no-cache', '-o', str(median)])
                  wanted = ''.join(str(value) + '\n' for _, _, value in cases).encode()
                  require(run([str(median)]).stdout == wanted, 'compiled median disagrees with exact controls')
                  timer = work / 'timing'
                  run([str(compiler), 'compile', str(source), '--backend', 'native', '--no-cache', '-o', str(timer)])
                  good = shutil.which('true')
                  bad = shutil.which('false')
                  require(good and bad, 'process controls unavailable')
                  args = [str(timer), good, good, '21', '3', '0', '', str(compiler), 'native-no-cache', revision, '200']
                  expected = {'status': 'ok', 'verdict': 'inconclusive', 'analysis': 'descriptive', 'significant': 'unverified', 'compiler': str(compiler), 'compiler_sha256': before, 'build_config': 'native-no-cache', 'source_rev': revision, 'rounds': '21', 'warmup': '3', 'expected_exit': '0', 'tolerance_basis_points': '200', 'candidate': good, 'comparator': good, 'candidate_size': Path(good).stat().st_size, 'comparator_size': Path(good).stat().st_size}
                  result = run(args)
                  print(result.stdout.decode(), flush=True)
                  check(result.stdout, expected, 21)
                  damaged_count = 0
                  def must_reject(body, label):
                      nonlocal damaged_count
                      try:
                          check(body, expected, 21)
                      except RuntimeError:
                          damaged_count += 1
                      else:
                          raise RuntimeError('damaged provenance was accepted: ' + label)
                  def mutate_field(body, key, bad):
                      out = []
                      for line in body.decode().splitlines():
                          k, sep, v = line.partition(': ')
                          if k == key:
                              v = bad
                          out.append(k + sep + v)
                      return ('\n'.join(out) + '\n').encode()
                  for replacement, label in (
                      ('4299405008', 'pointer-shaped digest'),
                      ('0' * 64, 'zero digest'),
                      (before[:32], 'truncated digest'),
                      (before.upper(), 'uppercase digest'),
                      ('f' * 64, 'wrong 64-hex digest'),
                  ):
                      damaged = result.stdout.replace(before.encode(), replacement.encode())
                      require(damaged != result.stdout, 'digest mutation did not alter evidence: ' + label)
                      must_reject(damaged, label)
                  for key, badval in (
                      ('source_rev', '0' * 40),
                      ('compiler', '/nonexistent/idol'),
                      ('build_config', 'native-cache'),
                      ('rounds', '20'),
                      ('warmup', '2'),
                      ('expected_exit', '1'),
                      ('tolerance_basis_points', '100'),
                      ('candidate', '/nonexistent/true'),
                      ('comparator', '/nonexistent/true'),
                      ('candidate_size', '999999'),
                      ('comparator_size', '999999'),
                      ('status', 'mismatch'),
                      ('verdict', 'win'),
                      ('analysis', 'inferential'),
                      ('significant', 'yes'),
                  ):
                      must_reject(mutate_field(result.stdout, key, badval), 'wrong ' + key)
                  require(damaged_count == 20, 'damaged-report battery incomplete: %d' % damaged_count)
                  probe_bin = work / 'idol-probe'
                  shutil.copy2(compiler, probe_bin)
                  probe_before = digest(probe_bin)
                  with open(probe_bin, 'r+b') as f:
                      f.seek(1024)
                      chunk = f.read(16)
                      f.seek(1024)
                      f.write(bytes(b ^ 0xff for b in chunk))
                  require(digest(probe_bin) != probe_before, 'mutation did not change digest')
                  try:
                      require(digest(probe_bin) == probe_before, 'compiler changed during observation')
                  except RuntimeError:
                      pass
                  else:
                      raise RuntimeError('mutated executable was accepted')
                  wrong = list(args)
                  wrong[1] = bad
                  rejected = run(wrong, success=False)
                  require(rejected.returncode == 1 and b'status: mismatch' in rejected.stdout, 'wrong exit was not rejected')
                  echo = shutil.which('echo')
                  require(echo, 'stdout control unavailable')
                  written = list(args)
                  written[1] = written[2] = echo
                  written[3] = '3'
                  written[4] = '0'
                  written[6] = '0a'
                  checked = dict(expected, candidate=echo, comparator=echo, candidate_size=Path(echo).stat().st_size, comparator_size=Path(echo).stat().st_size, rounds='3', warmup='0')
                  check(run(written).stdout, checked, 3)
                  written[6] = '00'
                  rejected = run(written, success=False)
                  require(rejected.returncode == 1 and b'status: mismatch' in rejected.stdout and b'phase: timed' in rejected.stdout, 'same-length wrong timed stdout was not rejected')
                  require(digest(compiler) == before, 'compiler changed during observation')
                  print(json.dumps({'outcome': 'pass', 'scope': 'native timer arithmetic, provenance and failure controls; not performance qualification', 'median_controls': len(cases), 'timed_invocations': 48, 'wrong_exit': 'rejected', 'wrong_timed_stdout': 'rejected', 'provenance_mutations': 2, 'compiler_sha256': before, 'timer_sha256': digest(timer), 'source_sha256': digest(source), 'revision': revision}))
          
          
          if __name__ == '__main__':
              exercise()
          PY

      - name: Materialize pinned idol-native root
        env:
          IDOL_NATIVE_DEPLOY_KEY: ${{ secrets.IDOL_NATIVE_DEPLOY_KEY }}
        run: |
          set -eu
          if [ -z "${IDOL_NATIVE_DEPLOY_KEY:-}" ]; then
            echo "idol-native deploy key not provisioned; skipping materialization (pairing will fail closed)"
            exit 0
          fi
          rev="$(jq -r '.servers[] | select(.name == "idol-native") | .revision' tools/node/dev/mcp.manifest.json)"
          case "$rev" in
            ''|*[!0-9a-f]*) echo "bad pinned revision: $rev" >&2; exit 1 ;;
          esac
          keyfile="$(mktemp "${RUNNER_TEMP:-/tmp}/idol-native-key.XXXXXX")"
          chmod 600 "$keyfile"
          printf '%s' "$IDOL_NATIVE_DEPLOY_KEY" > "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          export GIT_SSH_COMMAND="ssh -i $keyfile -o StrictHostKeyChecking=accept-new"
          rm -rf idol-native
          git init -q idol-native
          git -C idol-native remote add origin git@github.com:clpi/idol-native.git
          git -C idol-native fetch --depth 1 origin "$rev"
          git -C idol-native checkout -q "$rev"
          IDOL_NATIVE_ROOT="$GITHUB_WORKSPACE/idol-native" ./tools/node/dev/mcp-pair validate ./tools/node/dev/mcp.manifest.json idol-native

      - name: Unit and compile-fail tests
        run: zig build test
        env:
          IDOL_NATIVE_ROOT: ${{ github.workspace }}/idol-native

      - name: G-061 metaprogramming smokes
        run: zig build meta-smoke

      - name: G-061 strict transform gate
        run: zig build meta-gate

      - name: WASM compilation smoke test
        run: |
          ./zig-out/bin/idol compile examples/hello.lua --target wasm32-wasi -o /tmp/hello.wasm
          file /tmp/hello.wasm | grep -q "WebAssembly"
          echo "WASM OK"

      - name: Install pinned Wasmtime oracle
        run: |
          test "$(uname -sm)" = "Darwin arm64"
          archive="$RUNNER_TEMP/wasmtime-v47.0.3-aarch64-macos.tar.xz"
          curl --fail --location --silent --show-error \
            https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-aarch64-macos.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            c2684249e5d9ef9351942cf2d315982cf201fe0300f05d63bc1527446f0cd37f \
            "$archive" | shasum -a 256 --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v47.0.3-aarch64-macos" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wasmtime-v47.0.3-aarch64-macos/wasmtime" --version

      - name: Preserve compiler Zig for focused evidence
        run: echo "IDOL_ZIG=$(command -v zig)" >> "$GITHUB_ENV"

      - name: Install pinned Wart build Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1567+f0354179a
          use-cache: false

      - name: Build frozen Wart oracle
        run: |
          wart_repo="$RUNNER_TEMP/wart-oracle"
          git clone --filter=blob:none --no-checkout https://github.com/clpi/wart.git "$wart_repo"
          git -C "$wart_repo" checkout --detach ca2b0b9c0fb8c397987be2b4475fd1ccfe4d150b
          test "$(git -C "$wart_repo" rev-parse HEAD)" = ca2b0b9c0fb8c397987be2b4475fd1ccfe4d150b
          test -z "$(git -C "$wart_repo" status --porcelain=v1 --untracked-files=all)"
          (cd "$wart_repo" && zig build -Drelease=true)
          wart_bin="$wart_repo/zig-out/bin/wart"
          wart_hash=$(shasum -a 256 "$wart_bin" | cut -d ' ' -f 1)
          wart_provenance="$wart_bin.provenance"
          "$wart_bin" --version
          printf 'revision=%s\nzig_version=%s\nbuild=%s\nhost=%s\nbinary_sha256=%s\n' \
            ca2b0b9c0fb8c397987be2b4475fd1ccfe4d150b \
            "$(zig version)" \
            'zig build -Drelease=true' \
            "$(uname -sm)" \
            "$wart_hash" > "$wart_provenance"
          echo "WART_ORACLE_REPO=$wart_repo" >> "$GITHUB_ENV"
          echo "WART_ORACLE_BIN=$wart_bin" >> "$GITHUB_ENV"
          echo "WART_ORACLE_PROVENANCE=$wart_provenance" >> "$GITHUB_ENV"

      - name: WASM focused evidence against frozen oracles
        run: '"$IDOL_ZIG" build wasm-test'


  reproducibility:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Reproducibility smoke
        run: zig build reproducibility-smoke

  matrix-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Benchmark (explicit c-specialized profile)
        run: BENCH_BACKEND=c-specialized zig build bench

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: native
            artifact: idol
          - os: macos-latest
            target: native
            artifact: idol
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Rename binary for release
        run: mv zig-out/bin/idol zig-out/bin/idol-${{ matrix.os }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: idol-${{ matrix.os }}
          path: zig-out/bin/idol-${{ matrix.os }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/bin/idol-${{ matrix.os }}
