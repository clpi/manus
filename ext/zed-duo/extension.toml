id = "duo"
name = "Duo"
description = "Duo language support for Zed"
version = "0.1.0"
repository = ""
authors = [""]

[grammars.duo]
repository = "https://github.com/user/tree-sitter-duo"
rev = "main"

[languages.duo]
name = "Duo"
grammar = "duo"
language_servers = ["duo-lsp"]
